# Tool pins for this repository. Run `mise install` to get them.
# See https://github.com/simpsonm09-org/simpsonm09-repo-standard/blob/main/docs/adoption.md

[tools]

# Task runner
"aqua:casey/just" = "1.58.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:zizmorcore/zizmor" = "1.30.1"
go = "1.27.1"
node = "26"

# Linters
"aqua:grafana/flint" = "0.22.14"
golangci-lint = "2.14.0"

[env]
FLINT_CONFIG_DIR = ".github/config"

[tasks.lint]
description = "Run all lints"
run = "flint run"

[tasks."lint:fix"]
description = "Auto-fix lint issues"
run = "flint run --fix"

[tasks.test]
description = "Run the test suite"
run = "go test ./..."

[tasks.coverage]
description = "Run the tests and write coverage/lcov.info"
run = "node scripts/coverage.mjs"

[tasks.spec]
description = "Regenerate docs/openapi.json from the handler annotations"
run = "go run ./cmd/spec"

[tasks.serve]
description = "Serve the API on http://127.0.0.1:3000"
run = "go run ."
