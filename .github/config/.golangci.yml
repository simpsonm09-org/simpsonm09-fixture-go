# golangci-lint configuration. Flint reads it from $FLINT_CONFIG_DIR.
# Docs: https://golangci-lint.run/usage/configuration/
version: "2"

linters:
  default: standard
  enable:
    - funlen
    - gocognit
    - gocyclo
    - nestif
  settings:
    funlen:
      statements: 60
    # Fleet defaults. Keep every function at or below these thresholds.
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 10
    nestif:
      min-complexity: 4
